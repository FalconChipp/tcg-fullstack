# src/modules/cardsearch/graphql/inputs.gql
# Inputs & enums for the Card Search module

"""ISO-8601 calendar date in the form YYYY-MM-DD (UTC)."""
scalar Date

"""ISO-8601 timestamp with timezone, e.g. 2025-10-01T02:10:00Z."""
scalar DateTime

# ---------------------------------------------------------------------------
# Search
# ---------------------------------------------------------------------------

"""Ordering options for card searches."""
enum CardOrderBy {
  RELEVANCE
  NAME_ASC
  NAME_DESC
  NUMBER_ASC
  NUMBER_DESC
  SET_ASC
  SET_DESC
}

"""
Search across cards using any combination of:
- name
- number
- set
Supports the six common modes: Name, Name+Set, Name+Number, Number+Set, Number, Set.
"""
input SearchCardsInput {
  """Card name (fuzzy tokenized when fuzzy=true)."""
  name: String

  """Printed card number (keeps suffixes like '123a')."""
  number: String

  """
  Set selector (abbr, tcgdex code, ptcg code, or name fragment).
  Example: "SSP", "sv08", "sv8", "Surging Sparks"
  """
  set: String

  """Tokenized case-insensitive name matching when true (default: true)."""
  fuzzy: Boolean = true

  """Sort order (default: RELEVANCE)."""
  orderBy: CardOrderBy = RELEVANCE

  """Page size (1..200, default: 50)."""
  limit: Int = 50

  """Offset for pagination (>= 0, default: 0)."""
  offset: Int = 0
}

# ---------------------------------------------------------------------------
# Admin / Jobs
# ---------------------------------------------------------------------------

"""
Kinds of admin jobs that can be triggered from the UI.
These map to your scheduler handlers.
"""
enum AdminJobKind {
  """Fetch ECB FX and cache it."""
  FX_DAILY

  """Ingest a single set's metadata/cards from TCGdex."""
  INGEST_SET

  """Collect prices for a specific set from providers and snapshot latest."""
  COLLECT_PRICES

  """Compute 1/7/30/90 rollups for a specific set."""
  ROLLUP_SET

  """Rebuild rollups globally for all observed cards."""
  ROLLUP_ALL
}

"""
Flexible job launcher input used by Mutation.adminRunJob.
Only some fields are relevant per job kind.
"""
input AdminRunJobInput {
  """The job to run."""
  kind: AdminJobKind!

  """
  Target set (abbr/tcgdex/ptcg/name fragment) when applicable.
  Used by: INGEST_SET, COLLECT_PRICES, ROLLUP_SET
  """
  set: String

  """
  Re-fetch live data instead of using cache (ingest).
  Used by: INGEST_SET
  """
  refreshSet: Boolean

  """
  Collect prices starting from this date (inclusive).
  Used by: COLLECT_PRICES
  """
  since: Date

  """
  Warm the FX cache before price conversion.
  Used by: COLLECT_PRICES
  """
  prewarmFx: Boolean

  """
  Backfill FX days for gap-filling (1..365).
  Used by: COLLECT_PRICES
  """
  backfillFxDays: Int

  """
  Milliseconds to pause between provider calls to avoid rate limits.
  Used by: COLLECT_PRICES
  """
  pauseMs: Int

  """
  Dry run mode where supported (no DB writes).
  """
  dryRun: Boolean
}
